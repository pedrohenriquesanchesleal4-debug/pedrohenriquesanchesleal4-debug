<svg xmlns="http://www.w3.org/2000/svg" width="780" height="252" viewBox="0 0 780 252">
  <defs>
    <style>
      .term { font-family: 'Consolas', 'JetBrains Mono', 'Fira Code', monospace; font-size: 13.5px; }
      .dim  { fill: #8b949e; }
      .cmd  { fill: #d29922; }
      .prompt { fill: #8b949e; }
      .path { fill: #58a6ff; }
      .out  { fill: #c9d1d9; }
      .ok   { fill: #3fb950; }
      .acc  { fill: #58a6ff; }
      .bar  { fill: #21262d; }
      .barfill { fill: #3fb950; }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="780" height="252" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="779" height="251" rx="11.5" fill="none" stroke="#30363d"/>

  <!-- title bar -->
  <rect x="24" y="16" width="14" height="14" rx="7" fill="#ff5f57"/>
  <rect x="46" y="16" width="14" height="14" rx="7" fill="#febc2e"/>
  <rect x="68" y="16" width="14" height="14" rx="7" fill="#28c840"/>
  <text x="390" y="28" text-anchor="middle" class="term dim" font-size="12">pedrohsl — CI pipeline</text>

  <text x="30" y="62" class="term cmd">
    $ ship --release
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.3s" fill="freeze"/>
  </text>

  <text x="30" y="92" class="term out">
    lint
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="320" y="92" class="term ok">
    ✓
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.3s" fill="freeze"/>
  </text>

  <text x="30" y="118" class="term out">
    typecheck
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="320" y="118" class="term ok">
    ✓
    <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.3s" fill="freeze"/>
  </text>

  <text x="30" y="144" class="term out">
    test
    <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="320" y="144" class="term ok">
    ✓ 23 passed
    <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.3s" fill="freeze"/>
  </text>

  <text x="30" y="170" class="term out">
    build
    <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- progress bar -->
  <rect x="320" y="161" width="230" height="8" rx="4" fill="#21262d"/>
  <rect x="320" y="161" width="0" height="8" rx="4" fill="#3fb950">
    <animate attributeName="width" from="0" to="230" begin="2.9s" dur="1.6s" fill="freeze"/>
  </rect>
  <text x="560" y="170" class="term dim">
    100%
    <animate attributeName="opacity" from="0" to="1" begin="4.4s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="30" y="196" class="term ok">
    ✓ deploy → production
    <animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="30" y="222" class="term dim">
    → o que funciona hoje evolui amanhã
    <animate attributeName="opacity" from="0" to="1" begin="5.2s" dur="0.3s" fill="freeze"/>
  </text>

  <text x="30" y="240" class="term prompt">
    ➜
    <animate attributeName="opacity" from="0" to="1" begin="5.6s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="30" y="240" class="term acc cursor" dx="130">
    ▍
    <animate attributeName="opacity" from="0" to="1" begin="5.6s" dur="0.3s" fill="freeze"/>
  </text>
</svg>