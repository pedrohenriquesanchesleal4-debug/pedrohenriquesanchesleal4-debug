<svg xmlns="http://www.w3.org/2000/svg" width="780" height="220" viewBox="0 0 780 220">
  <defs>
    <style>
      .term { font-family: 'Consolas', 'JetBrains Mono', 'Fira Code', monospace; }
      .dim  { fill: #8b949e; }
      .out  { fill: #c9d1d9; }
      .acc  { fill: #58a6ff; }
    </style>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#0d419d"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f778ba"/>
      <stop offset="1" stop-color="#7a3d9d"/>
    </linearGradient>
  </defs>

  <rect width="780" height="220" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="779" height="219" rx="11.5" fill="none" stroke="#30363d"/>

  <rect x="24" y="16" width="14" height="14" rx="7" fill="#ff5f57"/>
  <rect x="46" y="16" width="14" height="14" rx="7" fill="#febc2e"/>
  <rect x="68" y="16" width="14" height="14" rx="7" fill="#28c840"/>
  <text x="390" y="28" text-anchor="middle" class="term dim" font-size="12">pedrohsl — uso por linguagem</text>

  <!-- grid lines -->
  <g stroke="#21262d" stroke-width="1">
    <line x1="90" y1="56" x2="750" y2="56"/>
    <line x1="90" y1="96" x2="750" y2="96"/>
    <line x1="90" y1="136" x2="750" y2="136"/>
    <line x1="90" y1="176" x2="750" y2="176"/>
  </g>

  <!-- bars: y baseline 176 -->
  <rect x="100" y="176" width="0" height="0" rx="4" fill="url(#g1)">
    <animate attributeName="height" from="0" to="110" begin="0.4s" dur="0.9s" fill="freeze"/>
    <animate attributeName="y" from="176" to="66" begin="0.4s" dur="0.9s" fill="freeze"/>
  </rect>
  <rect x="220" y="176" width="0" height="0" rx="4" fill="url(#g1)">
    <animate attributeName="height" from="0" to="74" begin="0.8s" dur="0.9s" fill="freeze"/>
    <animate attributeName="y" from="176" to="102" begin="0.8s" dur="0.9s" fill="freeze"/>
  </rect>
  <rect x="340" y="176" width="0" height="0" rx="4" fill="url(#g2)">
    <animate attributeName="height" from="0" to="64" begin="1.2s" dur="0.9s" fill="freeze"/>
    <animate attributeName="y" from="176" to="112" begin="1.2s" dur="0.9s" fill="freeze"/>
  </rect>
  <rect x="460" y="176" width="0" height="0" rx="4" fill="url(#g1)">
    <animate attributeName="height" from="0" to="46" begin="1.6s" dur="0.9s" fill="freeze"/>
    <animate attributeName="y" from="176" to="130" begin="1.6s" dur="0.9s" fill="freeze"/>
  </rect>
  <rect x="580" y="176" width="0" height="0" rx="4" fill="url(#g2)">
    <animate attributeName="height" from="0" to="28" begin="2.0s" dur="0.9s" fill="freeze"/>
    <animate attributeName="y" from="176" to="148" begin="2.0s" dur="0.9s" fill="freeze"/>
  </rect>

  <!-- labels -->
  <g class="term" font-size="12.5" text-anchor="middle">
    <text x="130" y="200" class="out">TypeScript</text>
    <text x="130" y="52" class="dim" opacity="0">
      <animate attributeName="opacity" to="1" begin="1.4s" dur="0.3s" fill="freeze"/>
    </text>
    <text x="250" y="200" class="out">Python</text>
    <text x="370" y="200" class="out">C#</text>
    <text x="490" y="200" class="out">PHP</text>
    <text x="610" y="200" class="out">HTML</text>
  </g>
</svg>