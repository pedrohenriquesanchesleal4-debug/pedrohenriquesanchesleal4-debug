<svg xmlns="http://www.w3.org/2000/svg" width="780" height="190" viewBox="0 0 780 190">
  <defs>
    <radialGradient id="glowTop" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSide" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#a371f7;#f778ba;#58a6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a371f7">
        <animate attributeName="stop-color" values="#a371f7;#f778ba;#58a6ff;#a371f7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f778ba">
        <animate attributeName="stop-color" values="#f778ba;#58a6ff;#a371f7;#f778ba" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style>
      .name { font-family: -apple-system, 'Segoe UI', Inter, Arial, sans-serif; font-size: 46px; font-weight: 900; letter-spacing: -1px; fill: url(#nameGrad); }
      .role { font-family: -apple-system, 'Segoe UI', Inter, Arial, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 4px; fill: #8b949e; }
      .tagline { font-family: 'Consolas', 'JetBrains Mono', monospace; font-size: 13px; fill: #58a6ff; }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .mark { fill: #a371f7; }
    </style>
  </defs>

  <rect width="780" height="190" rx="14" fill="#0d1117"/>
  <rect width="780" height="190" rx="14" fill="url(#glowTop)"/>
  <rect width="780" height="190" rx="14" fill="url(#glowSide)"/>
  <rect x="0.5" y="0.5" width="779" height="189" rx="13.5" fill="none" stroke="#21262d"/>

  <text x="60" y="92" class="name">Pedro Henrique Sanches Leal</text>
  <text x="61" y="128" class="role">FULL-STACK DEVELOPER &nbsp;·&nbsp; SYSTEMS ARCHITECT</text>
  <text x="60" y="162" class="tagline">⬢ const craft = discipline + architecture + taste</text>
  <text x="358" y="162" class="tagline cursor">▍</text>
  <text x="61" y="162" class="mark" font-size="13">▍</text>
</svg>
