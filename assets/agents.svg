<svg xmlns="http://www.w3.org/2000/svg" width="780" height="252" viewBox="0 0 780 252">
  <defs>
    <style>
      .term { font-family: 'Consolas', 'JetBrains Mono', 'Fira Code', monospace; font-size: 13.5px; }
      .dim  { fill: #8b949e; }
      .cmd  { fill: #d29922; }
      .prompt { fill: #8b949e; }
      .path { fill: #58a6ff; }
      .out  { fill: #c9d1d9; }
      .ok   { fill: #3fb950; }
      .acc  { fill: #58a6ff; }
      .bar  { fill: #21262d; }
      .barfill { fill: #58a6ff; }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .pulse { animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    </style>
  </defs>

  <rect width="780" height="252" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="779" height="251" rx="11.5" fill="none" stroke="#30363d"/>

  <!-- title bar -->
  <rect x="24" y="16" width="14" height="14" rx="7" fill="#ff5f57"/>
  <rect x="46" y="16" width="14" height="14" rx="7" fill="#febc2e"/>
  <rect x="68" y="16" width="14" height="14" rx="7" fill="#28c840"/>
  <text x="390" y="28" text-anchor="middle" class="term dim" font-size="12">izanagi — agent swarm</text>

  <text x="30" y="62" class="term cmd">
    $ izanagi run "ship feature"
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="30" y="86" class="term dim">
    ➜ classificando intenção · 21 agentes online
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- agent chips -->
  <g opacity="0" font-family="'Consolas','JetBrains Mono',monospace" font-size="12">
    <animate attributeName="opacity" to="1" begin="1.6s" dur="0.3s" fill="freeze"/>
    <rect x="30"  y="104" width="126" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="30"  y="104" width="126" height="30" rx="8" fill="#0d419d" opacity="0.25"/>
    <rect x="166" y="104" width="126" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="302" y="104" width="126" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="438" y="104" width="126" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="574" y="104" width="126" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle cx="48" cy="119" r="4" fill="#3fb950" class="pulse"/>
    <circle cx="184" cy="119" r="4" fill="#58a6ff" class="pulse"/>
    <circle cx="320" cy="119" r="4" fill="#f778ba" class="pulse"/>
    <circle cx="456" cy="119" r="4" fill="#d29922" class="pulse"/>
    <circle cx="592" cy="119" r="4" fill="#8b949e" class="pulse"/>
    <text x="62" y="123" fill="#c9d1d9">ROUTER</text>
    <text x="198" y="123" fill="#c9d1d9">PLANNER</text>
    <text x="334" y="123" fill="#c9d1d9">EXECUTOR</text>
    <text x="470" y="123" fill="#c9d1d9">EVALUATOR</text>
    <text x="606" y="123" fill="#c9d1d9">MEMORY</text>
  </g>

  <text x="30" y="168" class="term ok">
    ✓ grafo executável montado · swarm paralelo
    <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="30" y="192" class="term ok">
    ✓ avaliado 0.94 · recuperado 0 falhas
    <animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="30" y="216" class="term dim">
    → lições gravadas na memória entre sessões
    <animate attributeName="opacity" from="0" to="1" begin="3.9s" dur="0.3s" fill="freeze"/>
  </text>

  <text x="30" y="240" class="term prompt">
    ➜
    <animate attributeName="opacity" from="0" to="1" begin="4.4s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="48" y="240" class="term path">
    feature
    <animate attributeName="opacity" from="0" to="1" begin="4.4s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="100" y="240" class="term dim">
    ~
    <animate attributeName="opacity" from="0" to="1" begin="4.4s" dur="0.3s" fill="freeze"/>
  </text>
  <text x="30" y="240" class="term acc cursor" dx="130">
    ▍
    <animate attributeName="opacity" from="0" to="1" begin="4.4s" dur="0.3s" fill="freeze"/>
  </text>
</svg>