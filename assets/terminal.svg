<svg xmlns="http://www.w3.org/2000/svg" width="780" height="252" viewBox="0 0 780 252">
  <defs>
    <style>
      .term { font-family: 'Consolas', 'JetBrains Mono', 'Fira Code', monospace; font-size: 13.5px; }
      .dim  { fill: #8b949e; }
      .cmd  { fill: #d29922; }
      .prompt { fill: #8b949e; }
      .path { fill: #58a6ff; }
      .out  { fill: #c9d1d9; }
      .ok   { fill: #3fb950; }
      .str  { fill: #f778ba; }
      .acc  { fill: #58a6ff; }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="780" height="252" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="779" height="251" rx="11.5" fill="none" stroke="#30363d"/>

  <!-- title bar -->
  <rect x="24" y="16" width="14" height="14" rx="7" fill="#ff5f57"/>
  <rect x="46" y="16" width="14" height="14" rx="7" fill="#febc2e"/>
  <rect x="68" y="16" width="14" height="14" rx="7" fill="#28c840"/>
  <text x="390" y="28" text-anchor="middle" class="term dim" font-size="12">pedrohsl — zsh</text>

  <text x="30" y="62" class="term dim">$ whoami</text>
  <text x="30" y="86" class="term prompt">➜</text>
  <text x="48" y="86" class="term path">dev</text>
  <text x="76" y="86" class="term dim">@pedrohsl</text>
  <text x="145" y="86" class="term dim">~</text>
  <text x="160" y="86" class="term cmd">$ whoami</text>
  <text x="30" y="108" class="term ok">pedro-henrique-sanches-leal</text>

  <text x="30" y="136" class="term prompt">➜</text>
  <text x="48" y="136" class="term path">dev</text>
  <text x="76" y="136" class="term dim">@pedrohsl</text>
  <text x="145" y="136" class="term dim">~</text>
  <text x="160" y="136" class="term cmd">$ echo $CURRENT_FOCUS</text>
  <text x="30" y="158" class="term ok">Izanagi AI</text>
  <text x="112" y="158" class="term dim">— framework de engenharia de software autônoma orientada a agentes</text>
  <text x="30" y="178" class="term dim">12 agentes · 79+ skills · CLI npm · engines de decisão, memória e auto-recuperação</text>

  <text x="30" y="206" class="term prompt">➜</text>
  <text x="48" y="206" class="term path">dev</text>
  <text x="76" y="206" class="term dim">@pedrohsl</text>
  <text x="145" y="206" class="term dim">~</text>
  <text x="160" y="206" class="term cmd">$ echo $PHILOSOPHY</text>
  <text x="30" y="228" class="term str">"Arquitetura é a arte de fazer decisões que importam."</text>
  <text x="30" y="228" class="term dim" dx="390">— SYSTEM.md</text>
  <text x="30" y="228" class="term acc cursor" dx="500">▍</text>
</svg>
